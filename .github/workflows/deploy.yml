name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test || echo "No tests configured"
      
    - name: Build Docker image
      run: |
        docker build -t openclaw-control:${{ github.sha }} .
        docker tag openclaw-control:${{ github.sha }} openclaw-control:latest
        
    - name: Deploy to production server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/openclaw-control
          
          # Pull latest changes
          git fetch origin
          git reset --hard origin/main
          
          # Update environment if needed
          # echo "${{ secrets.ENV_PROD }}" > .env.prod
          
          # Deploy
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d --build
          
          # Cleanup
          docker system prune -f
          
          # Verify deployment
          sleep 10
          curl -f http://localhost:7000/api/health || exit 1
